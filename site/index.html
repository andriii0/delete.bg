<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="delete.bg — Remove photo backgrounds">delete.bg — Remove photo backgrounds</title>
    <meta data-i18n-content="Remove a photo background on your device. Refine the edges and export a transparent PNG."
      name="description"
      content="Remove a photo background on your device. Refine the edges and export a transparent PNG."
    />
    <link rel="icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing">
    <header class="bar">
      <a class="brand" href="./"
        ><span class="brandmark" aria-hidden="true"></span
        ><span>delete<span class="suffix">.bg</span></span></a
      >
      <select data-i18n-aria-label="Language" id="language" aria-label="Language">
        <option value="en" lang="en">EN</option>
        <option value="ru" lang="ru">RU</option></select
      ><a class="nav-link" href="editor/"
        ><span data-i18n="Editor">Editor</span>
        <svg
          class="ico"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 18 18 6M7 6h11v11" /></svg
      ></a>
    </header>
    <main class="home-grid">
      <div class="intro">
        <h1>
          <span data-i18n="Remove the">Remove the</span><br />
          <span data-i18n="background">background</span><span class="period">.</span>
        </h1>
        <button id="zone" class="upload">
          <span class="cta"
            ><svg
              class="ico"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5" /></svg
            ><span data-i18n="Choose a photo">Choose a photo</span></span
          ><span class="hint"
            ><span data-i18n="Drop an image here or press">Drop an image here or press</span> <kbd>Ctrl+V</kbd></span
          >
        </button>
        <button id="paste" class="text-btn paste">
          <svg
            class="ico"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 5H5v16h14V5h-3" />
            <rect x="8" y="2" width="8" height="5" rx="1" /></svg
          ><span data-i18n="Paste from clipboard">Paste from clipboard</span>
        </button>
        <p id="message" role="status"></p>
      </div>
      <figure class="proof">
        <div class="comparison check">
          <img data-i18n-alt="Pink gerbera with its background removed"
            src="assets/after.webp"
            alt="Pink gerbera with its background removed"
          /><img class="source" src="assets/before.webp" alt="" /><span
            class="divider"
            aria-hidden="true"
            ><i
              ><svg
                class="ico"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m9 8-4 4 4 4m6-8 4 4-4 4" /></svg></i></span
          ><input data-i18n-aria-label="Compare original and cutout"
            type="range"
            class="split"
            min="0"
            max="100"
            value="50"
            aria-label="Compare original and cutout"
          />
        </div>
        <figcaption><span data-i18n="Original">Original</span><span data-i18n="Cutout">Cutout</span></figcaption>
      </figure>
    </main>
    <footer class="home-foot">
      <span
        ><svg
          class="ico"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="10" width="14" height="11" rx="2" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
        ><span data-i18n="Processed on your device.">Processed on your device.</span></span
      >
      <nav>
        <a data-i18n="Credits" href="licenses/">Credits</a
        ><a href="https://github.com/andriii0/delete.bg"
          >GitHub
          <svg
            class="ico"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 18 18 6M7 6h11v11" /></svg
        ></a>
      </nav>
    </footer>
    <input id="file" type="file" accept="image/*" hidden />
    <script type="module" src="js/home.js"></script>
  </body>
</html>
